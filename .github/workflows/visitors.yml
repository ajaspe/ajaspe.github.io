name: Update visitor statistics

on:
  schedule:
    - cron: "15 5 * * *"   # daily 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visitors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch visitor counts from GoatCounter
        run: python .github/scripts/fetch_visitors.py

      - name: Commit the data file if it changed
        id: commit
        run: |
          if git diff --quiet -- _data/visitors.yml; then
            echo "No changes in visitor counts"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitors.yml
          git commit -m "Update visitor statistics"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
