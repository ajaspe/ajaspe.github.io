name: Check links

# Monthly check of the external links in the site sources (notes, data files, pages, posts).
# Broken links are collected into a GitHub issue; the workflow itself never fails the build.

on:
  schedule:
    - cron: "0 6 1 * *"   # first day of the month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --no-progress
            --base https://albertojaspe.net
            --accept 200..=299,403,429
            --timeout 25
            --max-retries 2
            --max-concurrency 8
            --exclude 'goatcounter\.com'
            --exclude 'linkedin\.com'
            --exclude 'twitter\.com'
            --exclude 'x\.com'
            --exclude 'scholar\.google'
            --exclude 'mailto:'
            './_notes/**/*.md' './_posts/**/*.md' './_data/*.yml' './*.md'

      - name: Open an issue with the broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links report"
          content-filepath: ./lychee/out.md
          labels: links
