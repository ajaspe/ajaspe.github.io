name: Update citation counts

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation counts from Semantic Scholar
        run: python .github/scripts/fetch_citations.py

      - name: Commit the data file if it changed
        id: commit
        run: |
          if git diff --quiet -- _data/citations.yml _data/citations_history.yml && [ -z "$(git status --porcelain _data/citations_history.yml)" ]; then
            echo "No changes in citation counts"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml _data/citations_history.yml
          git commit -m "Update citation counts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
