  - date: 2021-04-15
    kind: podcast
    outlet: La Vieja Guardia, episode 2x08
    title: "J.A.S.P.(e)"
    url: https://laviejaguardia.vg/j-a-s-p-e/
    spotify: 5cW62udeEoyoVA5EmNSaTp
    lang: es
    note: "A long conversation with the hosts of this veteran Spanish computing podcast: a childhood marked by a computer-scientist father, the demoscene years, RNASA and VideaLAB at the University of A Coruña, CRS4 in Sardinia and the move to KAUST."

  - date: 2014-06-26
    kind: video
