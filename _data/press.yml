    title: "Un computer pieno di pietre"
    url: https://www.youtube.com/watch?v=jNvCq1nSyXw
    youtube: jNvCq1nSyXw
    lang: it
    note: "Fabio Bettio and Alberto Jaspe, researchers at CRS4, on visual computing applied to cultural heritage: techniques that reproduce archaeological finds virtually down to the smallest detail. Three and a half minutes, in Italian."

