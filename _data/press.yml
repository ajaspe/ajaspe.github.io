# Press and media mentions, shown on /press/. Order does not matter: the page sorts by date, newest first.
#   - date: YYYY-MM-DD      sorting date (use 01 for an unknown day or month)
#     date_label: "2004"    optional text shown instead of the full date when only the year or month is known
#     kind: newspaper | web | magazine | report | video | podcast | photo   (coloured pill)
#     outlet: name of the newspaper, site, channel or event
#     title: "title of the piece"
#     url: link to the piece online, or to a scan under /assets/press/ when it is not online
#     scan: /assets/press/<file>   optional scan or photo of the printed page (jpg or pdf)
#     thumb: /assets/press/<file>-thumb.jpg   optional 570x380 thumbnail, usually a crop of the scan
#     youtube: <video id>            embeds the video in place when the thumbnail is clicked
#     youtube_list: [id, id, ...]    optional further videos played after the first one
#     spotify: <episode id>          embeds a Spotify podcast player
#     linkedin: <activity id>        embeds a public LinkedIn post (the number in urn:li:activity:<id>)
#     lang: es | gl | it             shown as a small label when the piece is not in English
#     note: "one or two lines of context"
#     more: [{ name: "...", url: "..." }]   optional extra links
