name: Alberto Jaspe's website
title: Alberto Jaspe-Villanueva
description: Research scientist in computer graphics and scientific visualization at KAUST. Living pages, guides and occasional opinion posts.
author:
  name: Alberto Jaspe-Villanueva

collections:
  publications:
    output: true
  notes:
    output: true
    permalink: /:name/
  demos:
    output: true

# Blog posts live in _posts/ and are published at /blog/<slug>/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
  # Kept out of the sitemap: the PDFs in publications/ and assets/ (each paper already has its own page) and the unlisted game.
  # Plain folder scopes on purpose: a glob such as **/*.pdf makes the Jekyll 3.10 build of GitHub Pages crawl the tree for every file.
  - scope:
      path: "publications"
    values:
      sitemap: false
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "getgoaldone"
    values:
      sitemap: false
  # Bundled third-party libraries of the demos and of X3D Copilot
  - scope:
      path: "demos/libs"
    values:
      sitemap: false
  - scope:
      path: "x3d-copilot/vendor"
    values:
      sitemap: false
url: "https://albertojaspe.net"
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Footnotes ([^name] in posts): the back arrow as text, not as the blue emoji that Windows draws for a bare ↩
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"

feed:
  path: feed.xml
  posts_limit: 20

exclude:
  - tmp
  - DESK-NOTES.md
  # MARLIE demo: original maps the viewer never loads (the dataset config.json files only use the .jpg versions below
  # them). Kept in the repo, left out of the site to stay under the 1 GB GitHub Pages limit (about 570 MB less).
  # In Jekyll 3.10 a * here also matches "/", so the first line covers every PNG map under data/ (the annotation PNGs,
  # loaded by name from the code, have no "Map" in their name and stay).
  - demos/marlie/data/*Map*.png
  - demos/marlie/data/*/alphaMap.jpg
  - demos/marlie/data/*/ksMap.jpg
  - demos/marlie/data/demetrios/4096
  - demos/marlie/data/ghiberti/4096
  - demos/marlie/data/demetrios/false_color/fc_fluorescence_old.jpg
  - demos/marlie/data/demetrios/normalMap.jpg
  - demos/marlie/data/demetrios/uv/kdMap.jpg
  - demos/marlie/data/demetrios/vis/kdMap.jpg
  - demos/marlie/data/fattori/kdMap.jpg
  - demos/marlie/data/fattori/ksMap_x0_48.jpg
  - demos/marlie/data/ghiberti/ksMap_x0_32.jpg
