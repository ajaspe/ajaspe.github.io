<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif">
  <title>Video to Gaussian splats: the pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffa65d"/>
    </marker>
  </defs>
  <rect width="760" height="330" rx="12" fill="#161616"/>
  <g stroke="#ffa65d" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M168 85 H192"/><path d="M352 85 H376"/><path d="M536 85 H560"/>
    <path d="M650 130 V165 H110 V200"/>
    <path d="M208 245 H260"/><path d="M420 245 H472"/>
  </g>
  <g fill="#111" stroke="#555" stroke-width="1.5">
    <rect x="20" y="40" width="148" height="90" rx="8"/>
    <rect x="194" y="40" width="158" height="90" rx="8"/>
    <rect x="378" y="40" width="158" height="90" rx="8"/>
    <rect x="562" y="40" width="178" height="90" rx="8"/>
    <rect x="20" y="200" width="188" height="90" rx="8"/>
    <rect x="262" y="200" width="158" height="90" rx="8"/>
    <rect x="474" y="200" width="266" height="90" rx="8"/>
  </g>
  <g fill="#ffa65d" font-size="15" font-weight="bold">
    <text x="34" y="66">1 Phone video</text>
    <text x="208" y="66">2 Sharp frames</text>
    <text x="392" y="66">3 SfM (COLMAP)</text>
    <text x="576" y="66">4 Train (gsplat)</text>
    <text x="34" y="226">5 Tidy</text>
    <text x="276" y="226">6 Export</text>
    <text x="488" y="226">7 Web viewer</text>
  </g>
  <g fill="#ddd" font-size="12.5">
    <text x="34" y="88">walk around slowly,</text>
    <text x="34" y="105">0.5 – 3.5 min, 4K</text>
    <text x="208" y="88">~2.5 per second,</text>
    <text x="208" y="105">drop blurry and twins</text>
    <text x="208" y="122">~1 min</text>
    <text x="392" y="88">sequential + loops,</text>
    <text x="392" y="105">merge split models</text>
    <text x="392" y="122">~20 min (up to 2 h)</text>
    <text x="576" y="88">MCMC, or ADC + sky</text>
    <text x="576" y="105">mask outdoors, 30k it.</text>
    <text x="576" y="122">~14 min on a 4090</text>
    <text x="34" y="248">drop Gaussians few</text>
    <text x="34" y="265">views use, fine-tune</text>
    <text x="34" y="282">~3 min, +1.3 dB</text>
    <text x="276" y="248">.spz with SH 3</text>
    <text x="276" y="265">.splat base colour</text>
    <text x="276" y="282">seconds</text>
    <text x="488" y="248">three.js + Spark,</text>
    <text x="488" y="265">sky / background map behind</text>
    <text x="488" y="282">any phone or laptop</text>
  </g>
  <text x="20" y="24" fill="#999" font-size="12">Times are medians over ~30 captures, RTX 4090</text>
</svg>
